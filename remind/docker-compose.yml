services:
  postgres_db:
    image: postgres:15-alpine
    container_name: art_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: super_secret_password_123
      POSTGRES_DB: art_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: